name: Validate and build sample PDFs
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-liberation latexmk
      - run: python tools/build.py --edition all
      - uses: actions/upload-artifact@v4
        with:
          name: monotonicity-sample-pdfs
          path: dist/*.pdf
