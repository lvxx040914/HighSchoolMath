schema_version: 1
edition: v1.1
methods:
- id: MT-LOGIC-PROOF
  title: 充要条件与逆向论证
  related_topics:
  - T-PRE-03
  conditions: 区分必要与充分，双向分别证明
  failure_mode: 只证明一个方向即宣布等价
  status: planned
- id: MT-LOGIC-COUNTER
  title: 反例与边界值验证
  related_topics:
  - T-PRE-08
  conditions: 否定全称命题时给出合法反例
  failure_mode: 样本不满足前提
  status: planned
- id: MT-SET-REGION
  title: 集合与区间运算
  related_topics:
  - T-PRE-01
  conditions: 全集、端点及区间开闭一致
  failure_mode: 忽略空集或端点
  status: planned
- id: MT-INEQ-SIGN
  title: 因式分解与符号区间
  related_topics:
  - T-PRE-05
  conditions: 讨论根重数与分母禁区
  failure_mode: 两侧符号未核查
  status: planned
- id: MT-INEQ-PARAM
  title: 含参数判别式与分界
  related_topics:
  - T-PRE-06
  conditions: 分类穷尽并独立检查临界值
  failure_mode: 分界取等未覆盖
  status: planned
- id: MT-INEQ-AMGM
  title: 基本不等式及等号
  related_topics:
  - T-PRE-07
  conditions: 检查非负、定和定积与取等可行性
  failure_mode: 等号条件无法同时成立
  status: planned
- id: MT-FUN-DIFF
  title: 定义法比较差值
  related_topics:
  - T-FUN-03
  conditions: x1与x2在同一区间且x1<x2
  failure_mode: 跨定义域不连通区间比较
  status: planned
  legacy_method_id: M-DEFINITION-DIFF
- id: MT-FUN-COMPO
  title: 复合函数单调性
  related_topics:
  - T-FUN-08
  conditions: 内层值域必须落在外层单调区间
  failure_mode: 外层区间不适用
  status: planned
- id: MT-FUN-PIECE
  title: 分段讨论及端点拼接
  related_topics:
  - T-FUN-05
  conditions: 分界点函数值与左右性质均核查
  failure_mode: 各段单调就断言整体单调
  status: planned
- id: MT-FUN-ROOT
  title: 单调连续与介值数根
  related_topics:
  - T-FUN-09
  conditions: 确认连续性、极限及相应区间单调
  failure_mode: 只有极值未核存在性
  status: planned
  legacy_method_id: M-EXT-INTERVAL
- id: MT-FUN-AUX
  title: 构造函数与差值归零
  related_topics:
  - T-FUN-12
  conditions: 构造目的明确且定义域合法
  failure_mode: 任意构造后忽略取等
  status: planned
  legacy_method_id: M-AUX-FUNC
- id: MT-FUN-TRANSFORM
  title: 对称、平移与图像变换
  related_topics:
  - T-FUN-02
  conditions: 自变量和函数值变换先后明确
  failure_mode: 图像变换方向颠倒
  status: planned
- id: MT-CAL-SIGN
  title: 导数符号与单调性
  related_topics:
  - T-CAL-02
  conditions: 导数判定区间内可导，闭端点连续
  failure_mode: 导数为零就判极值
  status: planned
  legacy_method_id: M-DERIV-SIGN
- id: MT-CAL-CRITICAL
  title: 参数临界值分段
  related_topics:
  - T-CAL-07
  conditions: 临界参数、重根和定义域变化单独核查
  failure_mode: 分类遗漏等号
  status: planned
  legacy_method_id: M-PARAM-CASES
- id: MT-CAL-ENDPOINT
  title: 端点与极值综合比较
  related_topics:
  - T-CAL-03
  conditions: 定义域有界端点时先确认连续性
  failure_mode: 只比较内部驻点
  status: planned
  legacy_method_id: M-ENDPOINT
- id: MT-CAL-NECSUF
  title: 单调参数反推与充分性
  related_topics:
  - T-CAL-08
  conditions: 导数必要条件与严格单调充分性分开证
  failure_mode: 把导数非负直接等同严格递增
  status: planned
  legacy_method_id: M-NEC-SUFF
- id: MT-CAL-BOUND
  title: 参数区间交集与分界
  related_topics:
  - T-CAL-08
  conditions: 对所有自变量的不等式正确量词化
  failure_mode: 交换对任意与存在
  status: planned
  legacy_method_id: M-ALG-SPLIT
- id: MT-TRI-IDENT
  title: 三角恒等变换
  related_topics:
  - T-TRI-03
  conditions: 变换前后保证分母不为零
  failure_mode: 约分损失解
  status: planned
- id: MT-TRI-PHASE
  title: 三角函数化一角一函数
  related_topics:
  - T-TRI-04
  conditions: 幅值与相位定义正确
  failure_mode: 忽略定义域及周期
  status: planned
- id: MT-TRI-LAW
  title: 解三角形与边角对应
  related_topics:
  - T-TRI-07
  conditions: 边角对应且考虑多解
  failure_mode: 正弦定理反解遗漏钝角
  status: planned
- id: MT-VEC-COORD
  title: 向量坐标化
  related_topics:
  - T-VEC-02
  conditions: 基底独立且坐标系适配
  failure_mode: 坐标与几何意义不一致
  status: planned
- id: MT-VEC-DOT
  title: 数量积与投影
  related_topics:
  - T-VEC-03
  conditions: 数量积公式成立且模不为零时求夹角
  failure_mode: 除以零向量模
  status: planned
- id: MT-CPLX-MOD
  title: 复数代数与模几何
  related_topics:
  - T-VEC-07
  conditions: 共轭、模的性质正确
  failure_mode: 把复数当有序实数
  status: planned
- id: MT-SEQ-REC
  title: 递推关系化通项
  related_topics:
  - T-SEQ-04
  conditions: 初值、非零条件及递推范围齐全
  failure_mode: 得到通解却遗漏初值
  status: planned
- id: MT-SEQ-SUM
  title: 错位相减、裂项与分组
  related_topics:
  - T-SEQ-05
  conditions: 项数正确、首末项准确
  failure_mode: 移项后边界项漏写
  status: planned
- id: MT-SEQ-INDUCT
  title: 数学归纳法
  related_topics:
  - T-SEQ-08
  conditions: 基础步与归纳步成立且起始指标正确
  failure_mode: 归纳假设未用于下一步
  status: planned
- id: MT-SEQ-MONO
  title: 数列差商比较
  related_topics:
  - T-SEQ-06
  conditions: 取比时分母正性先证明
  failure_mode: 正负项混用比值法
  status: planned
- id: MT-STE-SYN
  title: 空间位置关系几何判定
  related_topics:
  - T-STE-02
  conditions: 判定定理前提逐项成立
  failure_mode: 两线平行推出线面平行时遗漏包含
  status: planned
- id: MT-STE-VECTOR
  title: 空间向量与法向量
  related_topics:
  - T-STE-05
  conditions: 选定非零法向量并核查所在平面
  failure_mode: 二面角余弦正负号弄反
  status: planned
- id: MT-STE-PROJ
  title: 空间几何体构造辅助垂线
  related_topics:
  - T-STE-06
  conditions: 垂足、正交投影位置确定
  failure_mode: 将斜线投影长度当实际长度
  status: planned
- id: MT-ANA-COORD
  title: 几何条件坐标化
  related_topics:
  - T-ANA-04
  conditions: 设点和轨迹范围不引入赘根
  failure_mode: 平方变形后不验根
  status: planned
- id: MT-ANA-CONIC
  title: 圆锥曲线定义与标准方程
  related_topics:
  - T-ANA-05
  conditions: 焦点参数范围与轨迹定义核验
  failure_mode: 标准式符号写反
  status: planned
- id: MT-ANA-VIETA
  title: 直线代入与韦达关系
  related_topics:
  - T-ANA-08
  conditions: 检验判别式及二次项系数非零
  failure_mode: 退化成一次方程未分类
  status: planned
- id: MT-ANA-INVARIANT
  title: 圆锥曲线定点定值
  related_topics:
  - T-ANA-09
  conditions: 区分恒成立参数域和有效交点
  failure_mode: 求得形式定值却无真实交点
  status: planned
- id: MT-STA-COUNT
  title: 分类加法与分步乘法
  related_topics:
  - T-STA-05
  conditions: 分类互斥且穷尽，分步无重复
  failure_mode: 重复计数或漏计
  status: planned
- id: MT-STA-EVENT
  title: 事件分解与条件概率
  related_topics:
  - T-STA-06
  conditions: 条件概率分母正且事件关系正确
  failure_mode: 独立与互斥混同
  status: planned
- id: MT-STA-DIST
  title: 分布列、期望与方差
  related_topics:
  - T-STA-07
  conditions: 概率非负且总和为一
  failure_mode: 概率漏项或期望错算
  status: planned
- id: MT-STA-EST
  title: 统计图表与结论校准
  related_topics:
  - T-STA-03
  conditions: 说明样本来源与描述统计局限
  failure_mode: 相关性说成因果性
  status: planned
- id: MT-MOD-MODEL
  title: 建模假设、量纲与敏感性
  related_topics:
  - T-MOD-01
  conditions: 量纲相容、适用范围明确
  failure_mode: 模型只是代入却声称预测有效
  status: planned
- id: MT-MOD-VALID
  title: 模型验证与误差来源
  related_topics:
  - T-MOD-05
  conditions: 区分拟合与预测、内外验证
  failure_mode: 训练效果当独立验证
  status: planned
- id: MT-EXT-INVARIANT
  title: 不变量与极端原理
  related_topics:
  - T-EXT-07
  conditions: 状态空间及操作前后不变性确证
  failure_mode: 观察少量例子就宣称不变量
  status: planned
- id: MT-EXT-CONSTRUCT
  title: 辅助构造与转化
  related_topics:
  - T-EXT-04
  conditions: 构造对象满足题设且方向可逆
  failure_mode: 构造附加假设未检验
  status: planned
